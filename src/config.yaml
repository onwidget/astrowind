site:
  name: Codemyc
  site: 'https://codemyc.com'
  base: '/'
  trailingSlash: false

  # From Google Search Console → Settings → Ownership verification → HTML tag.
  # Left empty until the property is claimed; no tag is rendered while it is.
  googleSiteVerificationId: ''

# Default SEO metadata. Pages override title/description via their own
# `metadata` object; everything else falls through to these values.
metadata:
  title:
    default: Codemyc — Senior Software, Direct
    template: '%s — Codemyc'
  description: 'Codemyc is a boutique nearshore software consultancy based in Latin America. Senior, certified, English-fluent engineers who assemble into the exact team your problem needs — in your time zone, at nearshore rates.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Codemyc
    images:
      - url: '~/assets/images/og-codemyc.png'
        width: 1200
        height: 630
        alt: 'Codemyc — senior software, direct. Boutique nearshore software consultancy in Montevideo, Uruguay.'
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr
